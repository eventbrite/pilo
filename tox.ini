[tox]
envlist =
    py{27,35,37,38,39,310,311,312}

[testenv]
extras = testing
install_command = python -m pip install {opts} {packages}
allowlist_externals = mkdir
use_develop = true
# Each interpreter may have a different coverage.py version. Keep their data
# files separate, and outside /src, so py311/py312 cannot trip over a stale
# or read-only .coverage file from another env or from the base image.
setenv =
    COVERAGE_FILE = /tmp/.coverage.{envname}

commands =
    mkdir -p /tmp/test-results/{envname}
    pytest --junit-prefix={envname} --junitxml=/tmp/test-results/{envname}/pytests.xml {posargs}
    coverage xml -o /tmp/coverage.xml
